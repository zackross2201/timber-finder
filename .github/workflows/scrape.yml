name: Scrape Marketplace

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Scraper
        run: python scrape.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_facebook.png

      - name: Commit Updated Listings
        run: |
          git config --global user.name "MarketplaceBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add listings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update listings" && git push)
